version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday, time: '05:00', timezone: America/Argentina/Buenos_Aires }
    open-pull-requests-limit: 5
    groups:
      production-dependencies: { dependency-type: production }
      development-dependencies: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '05:30', timezone: America/Argentina/Buenos_Aires }
    open-pull-requests-limit: 5
