name: provider-contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CHANGED_CODE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  classify:
    name: provider-contracts-classify
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      sqlite: ${{ steps.scope.outputs.sqlite }}
      postgres: ${{ steps.scope.outputs.postgres }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: pwsh
        run: |
          $base = $env:CHANGED_CODE_BASE_REF
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') { $base = 'HEAD^' }
          ./scripts/test-scope.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -BaseRef $base -HeadRef HEAD -GitHubOutput $env:GITHUB_OUTPUT

  sqlite-supported:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.sqlite == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - shell: pwsh
        run: ./scripts/verify-structure.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
      - shell: pwsh
        run: dotnet restore SharpAccess.sln --locked-mode
      - shell: pwsh
        run: dotnet build SharpAccess.sln --configuration Release --no-restore -warnaserror
      - shell: pwsh
        run: ./scripts/sqlite-smoke.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Configuration Release -NoBuild
      - shell: pwsh
        run: |
          $base = $env:CHANGED_CODE_BASE_REF
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') { $base = 'HEAD^' }
          ./scripts/provider-coverage.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Provider Sqlite -Configuration Release -ChangedCodeBaseRef $base -NoBuild
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sqlite-provider-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/provider-coverage/sqlite/**/*
            artifacts/test-results/provider-coverage/sqlite/**/*

  postgres-native:
    needs: classify
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || needs.classify.outputs.postgres == 'true')
    runs-on: windows-latest
    timeout-minutes: 60
    environment: postgres-evidence
    env:
      SHARPACCESS_PROVIDER_TEST_ALLOW_RESET: 'true'
      SHARPACCESS_POSTGRES_READINESS: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Provision local PostgreSQL evidence database
        shell: pwsh
        run: |
          $postgresPassword = "SharpAccessCi_$([guid]::NewGuid().ToString('N'))A1!"
          Write-Output "::add-mask::$postgresPassword"

          choco install postgresql16 --no-progress -y --params "/Password:$postgresPassword"
          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL installation failed. ExitCode=$LASTEXITCODE"
          }

          $postgresBin = 'C:\Program Files\PostgreSQL\16\bin'
          $postgresBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $env:PGPASSWORD = $postgresPassword

          $ready = $false
          foreach ($attempt in 1..30) {
            & "$postgresBin\pg_isready.exe" -h 127.0.0.1 -p 5432 -U postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw 'The runner-local PostgreSQL service did not become ready.'
          }

          & "$postgresBin\psql.exe" `
            -h 127.0.0.1 `
            -p 5432 `
            -U postgres `
            -d postgres `
            -v ON_ERROR_STOP=1 `
            -c 'CREATE DATABASE sharpaccess_contract_tests;'

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the SharpAccess scratch database. ExitCode=$LASTEXITCODE"
          }

          $connectionString = (
            'Host=127.0.0.1;' +
            'Port=5432;' +
            'Database=sharpaccess_contract_tests;' +
            'Username=postgres;' +
            "Password=$postgresPassword;" +
            'Timeout=15;' +
            'Command Timeout=30;' +
            'Cancellation Timeout=2000;' +
            'Pooling=true'
          )

          Write-Output "::add-mask::$connectionString"

          "SHARPACCESS_POSTGRES_TEST_CONNECTION_STRING=$connectionString" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append
      - shell: pwsh
        run: ./scripts/verify-structure.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
      - shell: pwsh
        run: dotnet restore SharpAccess.sln --locked-mode
      - shell: pwsh
        run: dotnet build SharpAccess.sln --configuration Release --no-restore -warnaserror
      - shell: pwsh
        run: ./scripts/provider-contracts.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Configuration Release -NoBuild -RequireConfigured
      - shell: pwsh
        run: ./scripts/provider-coverage.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Provider Postgres -Configuration Release -NoBuild -PromotionGate
      - shell: pwsh
        run: ./scripts/postgres-recovery-drill.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Configuration Release -NoRestore -NoBuild
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: postgres-provider-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/provider-coverage/postgres/**/*
            artifacts/test-results/provider-coverage/postgres/**/*
            artifacts/test-results/provider-contracts/postgres/**/*
            artifacts/operations/postgres-recovery/**/*
