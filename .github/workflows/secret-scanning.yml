name: secret scanning

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files for high-confidence secrets
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $patterns = @(
            '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            '\bgh[pousr]_[A-Za-z0-9]{36,}\b',
            '\bgithub_pat_[A-Za-z0-9_]{50,}\b',
            '\bAKIA[0-9A-Z]{16}\b',
            '\bxox[baprs]-[A-Za-z0-9-]{20,}\b')
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate tracked files.' }
          $findings = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $files) {
            if ($file -match '(?i)(?:^|/)packages\.lock\.json$|\.(?:db|png|jpg|jpeg|gif|ico|zip|nupkg|snupkg)$') { continue }
            $path = Join-Path $env:GITHUB_WORKSPACE $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $content = Get-Content -LiteralPath $path -Raw -ErrorAction SilentlyContinue
            foreach ($pattern in $patterns) {
              if ($content -match $pattern) { $findings.Add("$file : $pattern") }
            }
          }
          $trackedEnvironmentFiles = @($files | Where-Object { $_ -match '(?i)(?:^|/)\.env(?:\..+)?$' -and $_ -notmatch '(?i)\.example$' })
          foreach ($file in $trackedEnvironmentFiles) { $findings.Add("Tracked environment file: $file") }
          New-Item -ItemType Directory -Path artifacts/secret-scanning -Force | Out-Null
          [ordered]@{ schemaVersion = 1; revision = '${{ github.sha }}'; status = if ($findings.Count -eq 0) { 'passed' } else { 'failed' }; findingCount = $findings.Count; findings = @($findings) } |
            ConvertTo-Json -Depth 5 | Set-Content artifacts/secret-scanning/evidence.json -Encoding utf8
          if ($findings.Count -ne 0) { throw "High-confidence secret findings: $($findings -join ' | ')" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: secret-scanning-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/secret-scanning/evidence.json
