name: test-scope

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  classify:
    name: test-scope-classify
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      mutation_tier: ${{ steps.scope.outputs.mutation_tier }}
      core: ${{ steps.scope.outputs.core }}
      sqlite: ${{ steps.scope.outputs.sqlite }}
      postgres: ${{ steps.scope.outputs.postgres }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: pwsh
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          if ([string]::IsNullOrWhiteSpace($base)) { $base = 'HEAD^' }
          ./scripts/test-scope.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -BaseRef $base -HeadRef HEAD -GitHubOutput $env:GITHUB_OUTPUT
